name: CompanionReader
options:
  bundleIdPrefix: app.bookorb.companion
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    from: 3.11.1
targets:
  CompanionReader:
    type: application
    platform: iOS
    sources: [CompanionReader/Sources, CompanionReader/Shared]
    entitlements:
      path: CompanionReader/CompanionReader.entitlements
      properties:
        com.apple.security.application-groups: [group.app.bookorb.companion.reader]
    info:
      path: CompanionReader/Info.plist
      properties:
        ALTAppGroups: [group.app.bookorb.companion.reader]
        CFBundleURLTypes:
          - CFBundleURLName: app.bookorb.companion.reader
            CFBundleURLSchemes: [bookorb]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.bookorb.companion.continue
            UIApplicationShortcutItemTitle: Continue reading
            UIApplicationShortcutItemIconSymbolName: book
          - UIApplicationShortcutItemType: app.bookorb.companion.library
            UIApplicationShortcutItemTitle: Library
            UIApplicationShortcutItemIconSymbolName: books.vertical
          - UIApplicationShortcutItemType: app.bookorb.companion.browse
            UIApplicationShortcutItemTitle: Browse
            UIApplicationShortcutItemIconSymbolName: square.stack
    dependencies:
      - target: CompanionWidgets
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bookorb.companion.reader.ios
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 273ZP5N8FS
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "BookOrb: Unofficial Companion App"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
  CompanionWidgets:
    type: app-extension
    platform: iOS
    sources: [CompanionWidgets, CompanionReader/Shared]
    entitlements:
      path: CompanionWidgets/CompanionWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.bookorb.companion.reader]
    info:
      path: CompanionWidgets/Info.plist
      properties:
        CFBundleDisplayName: BookOrb
        ALTAppGroups: [group.app.bookorb.companion.reader]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bookorb.companion.reader.ios.widgets
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 273ZP5N8FS
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
